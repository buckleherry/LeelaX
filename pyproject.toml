[project]
name = "leelax"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "python-chess",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leelax"]
